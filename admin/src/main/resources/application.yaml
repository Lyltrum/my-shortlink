server:
  port: 8002

spring:
  application:
    name: short-link-admin
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: localhost
      port: 6379
      password: 1234
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          short-link-project:
            connectTimeout: 2000
            readTimeout: 10000
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848

short-link:
  group:
    max-num: 20
  flow-limit:
    enable: true
    time-window: 1
    max-access-count: 20
  jwt:
    # Access Token 有效期，单位：秒（默认 30 分钟）
    access-token-ttl: 1800
    # Refresh Token 有效期，单位：秒（默认 7 天）
    refresh-token-ttl: 604800
    # RSA 私钥路径（classpath）
    private-key-path: classpath:keys/private.pem
    # RSA 公钥路径（classpath）
    public-key-path: classpath:keys/public.pem
