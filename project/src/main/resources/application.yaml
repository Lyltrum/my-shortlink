server:
  port: 8001

spring:
  application:
    name: short-link-project
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: localhost
      port: 6379
      password: 1234
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8719

short-link:
  domain:
    default: localhost:8001
  stats:
    # MQ 实现切换：redis-stream（默认）或 rocketmq
    mq:
      type: rocketmq
    locale:
      amap-key: your-amap-key-here

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: short-link-stats-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
# 注意：若 Broker 日志中 brokerIP1 为容器内网 IP 导致生产者/消费者无法连接，
#       需在 rmqbroker 容器中执行：echo 'brokerIP1=127.0.0.1' >> /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
#       并重启容器：docker restart rmqbroker
  goto-domain:
    white-list:
      enable: false
      names: '拿个offer,知乎,掘金,博客园'
      details:
        - lu.com
        - zhihu.com
        - juejin.cn
        - cnblogs.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
