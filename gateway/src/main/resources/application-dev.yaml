spring:
  cloud:
    gateway:
      routes:
        - id: short-link-admin
          uri: lb://short-link-admin/api/short-link/admin/**
          predicates:
            - Path=/api/short-link/admin/**
          filters:
            - name: TokenValidate
              args:
                whitePathList:
                  - /api/short-link/admin/v1/user/login
                  - /api/short-link/admin/v1/user/has-username
                  - /api/short-link/admin/v1/user/refresh
                  - /api/short-link/admin/v1/user

        - id: short-link-project
          uri: lb://short-link-project/api/short-link/**
          predicates:
            - Path=/api/short-link/**
          filters:
            - name: TokenValidate

        - id: short-link-redirect
          uri: lb://short-link-project
          predicates:
            - Path=/{short-uri}

short-link:
  jwt:
    # Gateway 只加载公钥进行验签，公钥文件放在 gateway 资源目录
    public-key-path: classpath:keys/public.pem
