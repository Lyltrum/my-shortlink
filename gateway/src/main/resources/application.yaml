server:
  port: 8000
spring:
  application:
    name: short-link-gateway
  profiles:
    # active: aggregation
    active: dev
  data:
    redis:
      host: 192.168.100.128
      port: 6379
      password: 1234
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
