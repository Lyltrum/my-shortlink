server:
  port: 8000

spring:
  application:
    name: short-link-gateway
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      password: 1234
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
    circuitbreaker:
      sentinel:
        enabled: false
      resilience4j:
        enabled: true
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8720

short-link:
  jwt:
    public-key-path: classpath:keys/public.pem

resilience4j:
  circuitbreaker:
    instances:
      short-link-admin-cb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      short-link-project-cb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
